[project]
name = "devops-audit-agent"
version = "1.0.0"
description = "LLM-driven agent that audits GitHub repositories for DevOps best-practice violations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["eval/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
